<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Admin sign in | Trade Buddy</title>
<link rel="stylesheet" href="admin.css">
<style>
body{min-height:100dvh;display:grid;place-items:center;padding:16px}
.box{width:100%;max-width:410px;background:var(--s2);border:1px solid var(--line);border-radius:22px;padding:28px 24px}
.box h1{font-size:24px;margin:14px 0 4px}.box .sub{color:var(--mute);margin-bottom:10px}
.box input{width:100%}
.box .btn{width:100%;margin-top:18px;padding:13px}
.msg{margin-top:14px;font-size:13.5px;border-radius:10px;padding:10px 12px;display:none}
.msg.bad{display:block;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);color:#fecaca}
.msg.info{display:block;background:rgba(255,201,40,.1);border:1px solid rgba(255,201,40,.35);color:#ffe08a}
</style>
</head>
<body>
<div class="box">
  <div class="brand" style="padding:0"><span class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="#161100" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-4 3 3 5-6"/></svg></span><span>Trade Buddy<small>ADMINISTRATION</small></span></div>
  <h1>Admin sign in</h1>
  <p class="sub">Authorised administrators only.</p>
  <form id="f" novalidate>
    <label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" id="go" type="submit">Sign in</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
</div>
<script type="module">
import { auth, friendlyError } from "../firebase.js";
import { signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-functions.js";
import { app } from "../firebase.js";
var $ = function (i) { return document.getElementById(i); };
var ROLES = ["super_admin", "admin", "support"];
function show(t, c) { $("msg").textContent = t; $("msg").className = "msg " + c; }
var q = new URLSearchParams(location.search);
if (q.get("reason") === "expired") show("Your session expired. Please sign in again.", "info");
if (q.get("reason") === "denied") show("That account does not have administrator access.", "bad");
$("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var email = $("email").value.trim(), pw = $("pw").value;
  if (!email || !pw) return show("Enter your email and password.", "bad");
  $("go").disabled = true; $("go").textContent = "Signing in...";
  try {
    var cred = await signInWithEmailAndPassword(auth, email, pw);
    var tok = await cred.user.getIdTokenResult(true);   // force refresh so new role claims are picked up
    if (ROLES.indexOf(tok.claims.role) < 0) {
      await signOut(auth);
      show("That account does not have administrator access.", "bad");
    } else {
      try { await httpsCallable(getFunctions(app), "logAdminEvent")({ action: "admin_login" }); } catch (x) {}
      location.replace("index.html");
      return;
    }
  } catch (err) { show(friendlyError(err.code), "bad"); }
  $("go").disabled = false; $("go").textContent = "Sign in";
});
</script>
</body>
</html>
