<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060c09">
<title>Dashboard | Trade Buddy</title>
<style>
:root{--brand:#22c55e;--brand2:#86efac;--bg:#060c09;--s1:#0c1511;--s2:#111e18;--line:rgba(255,255,255,.1);--ink:#f2f7f4;--mute:#93a79b;--bad:#f87171;--amber:#fbbf24;--blue:#93c5fd;
--head:"Segoe UI","Helvetica Neue",system-ui,sans-serif;box-sizing:border-box}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.55 var(--head);overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.glow::before{content:"";position:absolute;left:50%;top:-260px;width:860px;height:560px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(34,197,94,.22),transparent)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-weight:800;font-size:19px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand),#15803d);display:grid;place-items:center}
.mark svg{width:16px;height:16px}
.out{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:8px 16px;cursor:pointer}
.out:hover{background:rgba(255,255,255,.1)}
.hello h1{font-size:clamp(26px,6vw,36px);font-weight:800;letter-spacing:-1px;line-height:1.1}
.hello p{color:var(--mute);margin-top:6px}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:rgba(255,255,255,.03)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber)}
.dot.ok{background:var(--brand);box-shadow:0 0 10px var(--brand)}
.dot.bad{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.stats div{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--s1);text-align:center}
.stats b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px}
.stats span{font-size:12.5px;color:var(--mute)}
.card{border:1px solid var(--line);border-radius:22px;padding:18px;background:linear-gradient(180deg,var(--s2),var(--s1));margin-bottom:18px}
.card h2{font-size:18px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;min-width:0;margin-bottom:10px}
select option{background:#0c1511}
textarea{resize:vertical;min-height:60px}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.btn{width:100%;background:var(--brand);color:#03150a;font:inherit;font-weight:700;border-radius:999px;padding:13px;border:1px solid var(--brand);cursor:pointer}
.btn:hover:not(:disabled){background:var(--brand2)}
.btn:disabled{opacity:.6}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{white-space:nowrap;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--mute);font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:7px 14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#06100b;border-color:var(--ink)}
.item{border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(255,255,255,.025)}
.item.Waiting{border-left-color:var(--amber)}.item.AtPOI{border-left-color:#60a5fa}.item.Entered{border-left-color:var(--brand)}
.it{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pair{font-weight:800;font-size:17px}.tf{color:var(--mute);font-size:13px;font-weight:400;margin-left:6px}
.Bullish{color:var(--brand2);font-weight:700}.Bearish{color:var(--bad);font-weight:700}
.meta{color:var(--mute);font-size:14px;margin-top:4px;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:13.5px;border-radius:999px;padding:6px 12px;cursor:pointer}
.acts button:hover{background:rgba(255,255,255,.1)}
.empty{text-align:center;color:var(--mute);padding:22px 8px}
.err{color:#fecaca;font-size:14px;margin-top:6px}
a:focus-visible,button:focus-visible{outline:2px solid var(--brand2);outline-offset:3px}
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="top">
    <a href="index.html" class="logo"><span class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="#03150a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12l4-4 3 3 5-6"/></svg></span>Trade Buddy</a>
    <button class="out" id="out">Log out</button>
  </div>

  <div class="hello">
    <h1 id="hi">Welcome</h1>
    <p>Your setups are saved to your account and sync across devices.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="st">Connecting to database...</span></div>
  </div>

  <div class="stats">
    <div><b id="nA">0</b><span>Active</span></div>
    <div><b id="nE">0</b><span>Entered</span></div>
    <div><b id="nT">0</b><span>Total</span></div>
  </div>

  <div class="card">
    <h2>New setup</h2>
    <div class="g3">
      <input id="pair" placeholder="Pair e.g. XAUUSD" autocapitalize="characters">
      <select id="bias"><option>Bullish</option><option>Bearish</option></select>
      <select id="tf"><option>M15</option><option>H1</option><option selected>H4</option><option>D1</option></select>
    </div>
    <input id="poi" placeholder="POI (e.g. 1H OB at 1.0850)">
    <textarea id="note" placeholder="Confirmation needed / notes"></textarea>
    <button class="btn" id="add">Save setup</button>
    <div class="err" id="err"></div>
  </div>

  <div class="card">
    <h2>Your setups</h2>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </div>
</div>

<script type="module">
import { auth, db, friendlyError } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import { collection, addDoc, onSnapshot, query, orderBy, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

var $ = function (i) { return document.getElementById(i); };
var STATUS = ["Waiting", "At POI", "Entered", "Done"], items = [], filter = "Active", col = null;
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function setStatus(t, c) { $("st").textContent = t; $("dot").className = "dot " + c; }

$("out").onclick = function () { signOut(auth).then(function () { location.replace("login.html"); }); };

onAuthStateChanged(auth, function (u) {
  if (!u) { location.replace("login.html"); return; }
  $("hi").textContent = "Welcome, " + (u.displayName ? u.displayName.split(" ")[0] : "trader");
  col = collection(db, "users", u.uid, "setups");
  onSnapshot(query(col, orderBy("createdAt", "desc")), function (snap) {
    items = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
    setStatus("Connected. Saved to your account", "ok");
    render();
  }, function (e) { setStatus("Database error: " + (e.code || "unknown"), "bad"); $("err").textContent = friendlyError(e.code) + " (" + (e.code || "") + ")"; });
});

function render() {
  var act = items.filter(function (i) { return i.s !== "Done"; }).length, ent = items.filter(function (i) { return i.s === "Entered"; }).length;
  $("nA").textContent = act; $("nE").textContent = ent; $("nT").textContent = items.length;
  var tabs = ["Active"].concat(STATUS).concat(["All"]);
  function ok(i, t) { return t === "All" || (t === "Active" ? i.s !== "Done" : i.s === t); }
  $("tabs").innerHTML = tabs.map(function (t) { return '<button class="' + (t === filter ? "on" : "") + '" data-t="' + t + '">' + t + " (" + items.filter(function (i) { return ok(i, t); }).length + ")</button>"; }).join("");
  var shown = items.filter(function (i) { return ok(i, filter); });
  if (!shown.length) { $("list").innerHTML = '<div class="empty">Nothing here yet. Save your first setup above.</div>'; return; }
  $("list").innerHTML = shown.map(function (i) {
    var next = STATUS[Math.min(STATUS.indexOf(i.s) + 1, 3)];
    return '<div class="item ' + esc(i.s).replace(" ", "") + '"><div class="it"><span class="pair">' + esc(i.p) + '<span class="tf">' + esc(i.tf) + '</span></span><span class="' + esc(i.b) + '">' + esc(i.b) + '</span></div>' +
      '<div class="meta">POI: ' + esc(i.poi || "-") + "\nStatus: " + esc(i.s) + (i.c ? "\n" + esc(i.c) : "") + "</div>" +
      '<div class="acts">' + (i.s !== "Done" ? '<button data-a="next" data-id="' + i.id + '">Mark ' + next + "</button>" : "") +
      '<button data-a="inv" data-id="' + i.id + '">Invalidated</button><button data-a="del" data-id="' + i.id + '">Delete</button></div></div>';
  }).join("");
}

$("tabs").onclick = function (e) { var t = e.target.getAttribute("data-t"); if (t) { filter = t; render(); } };

$("add").onclick = async function () {
  var p = $("pair").value.trim().toUpperCase(); $("err").textContent = "";
  if (!p) { $("pair").focus(); return; }
  $("add").disabled = true;
  try {
    await addDoc(col, { p: p, b: $("bias").value, tf: $("tf").value, poi: $("poi").value.trim(), c: $("note").value.trim(), s: "Waiting", createdAt: serverTimestamp() });
    $("pair").value = ""; $("poi").value = ""; $("note").value = "";
  } catch (e) { $("err").textContent = friendlyError(e.code) + " (" + (e.code || "") + ")"; }
  $("add").disabled = false;
};

$("list").onclick = async function (e) {
  var a = e.target.getAttribute("data-a"), id = e.target.getAttribute("data-id"); if (!a) return;
  var it = items.filter(function (i) { return i.id === id; })[0], ref = doc(col, id);
  try {
    if (a === "next") await updateDoc(ref, { s: STATUS[Math.min(STATUS.indexOf(it.s) + 1, 3)] });
    else if (a === "inv") await updateDoc(ref, { s: "Done", c: (it.c ? it.c + "\n" : "") + "Invalidated" });
    else if (a === "del" && confirm("Delete " + it.p + "?")) await deleteDoc(ref);
  } catch (err) { $("err").textContent = friendlyError(err.code); }
};
</script>
</body>
</html>
